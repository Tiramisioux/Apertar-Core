# Apertar media tuning: the write-path knobs for the recording drive, as a file instead of environment variables.
#
# Install (owned by pi, no sudo):  cp config/apertar-media-tune.conf ~/apertar-media-tune.conf
#
# Precedence, per knob, first hit wins:
#   1. the knob's environment variable (named in each comment below)
#   2. the override file /run/apertar-media/media-tune.override.conf (edited with scripts/apertar-tune;
#      it lives in RAM and is gone at reboot, for test nights)
#   3. this file
#   4. Core's built-in default
# Within a file: [<class>.<filesystem>], then [<filesystem>], then [<class>], then [default].
#
# Sections (lower case):
#   [default]                 every medium
#   [exfat] [ext4] [vfat] [ntfs] [ntfs-fuse] [other]                 by filesystem
#   [pi-nvme] [usb-uas] [usb-storage] [sd-card] [other]              by connection
#   [pi-nvme.exfat], [usb-uas.ext4], ...                             one connection with one filesystem
#
# Core reads this file at start and when a take starts. dontneed and writeback are fixed for the life of the
# process: a change to them needs a Core restart. Put a comment on its own line; a trailing comment makes the
# value invalid. An unknown key or a bad value is ignored and named in the journal ("media tune: warning").
# Core logs the values in effect at start ("ApertarCore media tune: ...").

[default]
# dontneed = sync | writer | off. When a written DNG's pages leave the page cache: sync = on the sync thread
# after the fsync, writer = right after the write, off = never. Env: APERTAR_DNG_DONTNEED.
dontneed = sync
# writeback = on | off. A sync_file_range per written DNG, so the kernel starts writing the frame at once.
# Env: APERTAR_DNG_WRITEBACK.
writeback = on
# sync_ms = 0..60000. The once-a-second fsync of the finished DNGs and the clip folder during a take;
# 0 = off (and then dontneed = sync has no thread to run on). Env: APERTAR_MEDIA_SYNC_MS.
sync_ms = 1000
# raw_buffers = 3..16. The absolute number of raw camera buffers, replacing the built-in 4 (8 in Clear HDR)
# plus extra_raw_buffers. It applies to every raw mode. Env: APERTAR_RAW_CAMERA_BUFFERS.
raw_buffers = 8
# kernel_tune = on | off. Dirty-page, scheduler and queue tuning of the recording drive through the root helper
# apertar-media-tune. Env: APERTAR_MEDIA_TUNE (1 = on, anything else = off).
kernel_tune = off

[exfat]
# workers = 1..8. Uncompressed cDNG writer threads (never more than the format allows). No env variable
# of its own for this table value; APERTAR_CDNG_UNCOMPRESSED_WORKERS wins over it.
workers = 4
# queue = 4..64. Frames the write queue holds (compressed cDNG and lossy DNG on 4+ cores keep their own 24).
# APERTAR_CDNG_QUEUE_FRAMES wins over it.
queue = 12
# extra_raw_buffers = 0..8. Camera buffers added to the built-in count when raw_buffers is not set.
extra_raw_buffers = 0

[ext4]
workers = 4
queue = 12
extra_raw_buffers = 0
