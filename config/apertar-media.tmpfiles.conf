# /etc/tmpfiles.d/apertar-media.conf  (install with: sudo install -m 0644 config/apertar-media.tmpfiles.conf /etc/tmpfiles.d/apertar-media.conf; sudo systemd-tmpfiles --create)
# Runtime state shared between apertar-core and the automounter: eject-intent flags and saved kernel settings.
d /run/apertar-media        0755 pi pi -
d /run/apertar-media/eject  0755 pi pi -
d /run/apertar-media/tune   0755 root root -
