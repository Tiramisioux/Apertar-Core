# Apertar hardware configuration for the secondary Core (apertar-core-cam1.service, camera cam1)
# Install: /home/pi/apertar-hardware-cam1.conf, named by APERTAR_HARDWARE_CONFIG in the cam1 unit.
# The primary Core owns every input, the INA219 and the IMU; the secondary reads none of them.
# Model: the template in ApertarCoreApp.cpp (defaultHardwareConfigTemplate) and /home/pi/apertar-hardware.conf.

[ina219]
enabled=false

[imu]
enabled=false

[pcf8574]
enabled=false

[neorotary4]
enabled=false

[gpio_buttons]
enabled=false

[gpio_encoders]
enabled=false

[gpio_switches]
enabled=false

[grove_analog]
enabled=false

[trigger_output]
enabled=false

[recording_indicator]
enabled=false

[storage]
# buffer=frames (design 3.1, C6). frames_per_folder is the primary's (5000 in /home/pi/apertar-hardware.conf on
# 2026-11-11), so cam1 splits its clips as cam0 does.
buffer=frames
frames_per_folder=5000
